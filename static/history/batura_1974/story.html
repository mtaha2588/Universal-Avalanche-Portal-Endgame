<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batura Avalanche 3D</title>
<style>
  :root { --bg:#0d0d0d; --panel:rgba(26,26,25,0.86); --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --line:#383835; --red:#e66767; --crit:#d03b3b; --orange:#d95926; --blue:#3987e5; --violet:#9085e9;
          --aqua:#199e70; --yellow:#c98500; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  #gl:active { cursor:grabbing; }
  .panel { position:fixed; background:var(--panel); border:1px solid rgba(255,255,255,0.08); border-radius:10px;
           backdrop-filter: blur(6px); }
  #hud { top:14px; left:14px; padding:14px 18px; max-width:min(560px, calc(100vw - 28px)); }
  #hud h1 { margin:0 0 2px; font-size:18px; letter-spacing:0.2px; }
  #hud .sub { color:var(--ink2); font-size:12px; }
  #date { font-size:34px; font-weight:700; margin-top:8px; font-variant-numeric: tabular-nums; }
  #phase { font-size:14px; color:var(--ink2); margin-top:2px; min-height:18px; }
  #phase.alert { color:#ff8a7a; font-weight:700; }
  #vals { display:grid; grid-template-columns: repeat(3, auto); gap:6px 18px; margin-top:10px; font-size:13px; }
  #vals b { font-size:16px; font-variant-numeric: tabular-nums; }
  #vals span { color:var(--muted); display:block; font-size:11px; }
  #chips { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; min-height:22px; }
  .chip { font-size:11px; padding:3px 8px; border-radius:999px; background:rgba(208,59,59,0.22); color:#ffb3a8;
          border:1px solid rgba(208,59,59,0.5); }
  #side { top:14px; right:14px; width:330px; padding:12px 14px; max-height:calc(100vh - 120px); overflow:auto; }
  #side h2 { margin:0 0 6px; font-size:13px; color:var(--ink2); font-weight:600; text-transform:uppercase; letter-spacing:0.6px; }
  #charts { width:100%; display:block; }
  #facts { margin:10px 0 0; padding:0; list-style:none; font-size:12.5px; line-height:1.5; }
  #facts li { display:flex; justify-content:space-between; gap:10px; border-top:1px solid var(--line); padding:4px 0; }
  #facts li span:first-child { color:var(--muted); }
  #facts li span:last-child { text-align:right; font-variant-numeric: tabular-nums; }
  #note { color:var(--muted); font-size:11px; margin-top:8px; }
  #controls { left:50%; transform:translateX(-50%); bottom:14px; padding:10px 14px; display:flex; gap:10px;
              align-items:center; flex-wrap:wrap; justify-content:center; width:min(980px, calc(100vw - 28px)); }
  button, select { background:#2c2c2a; color:var(--ink); border:1px solid #4a4a46; border-radius:7px; padding:7px 11px;
                   font-size:13px; cursor:pointer; font-family:inherit; }
  button:hover { background:#383835; }
  button.primary { background:var(--crit); border-color:var(--crit); font-weight:700; min-width:84px; }
  #slider { flex:1 1 260px; accent-color: var(--crit); }
  label.small { font-size:12px; color:var(--ink2); display:flex; align-items:center; gap:6px; }
  #labels div { position:fixed; transform:translate(-50%, -100%); font-size:12px; font-weight:700; color:#fff;
                text-shadow:0 1px 3px #000, 0 0 8px #000; pointer-events:none; white-space:nowrap; }
  #labels div::after { content:''; display:block; width:1px; height:14px; background:rgba(255,255,255,0.7); margin:2px auto 0; }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:30px; }
  @media (max-width: 760px) { #side { display:none; } #date { font-size:26px; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<section id="hud" class="panel">
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>
  <div id="date"></div>
  <div id="phase"></div>
  <div id="vals"></div>
  <div id="chips"></div>
</section>
<aside id="side" class="panel">
  <h2>How the factors changed</h2>
  <canvas id="charts"></canvas>
  <h2 style="margin-top:12px">Model result</h2>
  <ul id="facts"></ul>
  <div id="note"></div>
</aside>
<footer id="controls" class="panel">
  <button id="play" class="primary">▶ Play</button>
  <input id="slider" type="range" min="0" max="10" step="0.01" value="0" aria-label="Day">
  <button id="replay">↻ Avalanche</button>
  <select id="view" aria-label="Camera">
    <option value="overview">View: whole basin</option>
    <option value="release">View: release slope</option>
    <option value="valley">View: down the glacier</option>
    <option value="top">View: from above</option>
  </select>
  <label class="small">Height ×<input id="ve" type="range" min="1" max="2.5" step="0.1" style="width:80px"></label>
  <label class="small"><input id="flbox" type="checkbox" checked> 0 °C level</label>
  <button id="snap">Save image</button>
  <button id="fs">Full screen</button>
</footer>
<div id="err"></div>

  $('chips').innerHTML = dd.flags.map(f => `<span class="chip">${f}</span>`).join('');
  slider.value = dayF;
}

// ---------- render loop ----------
const LIGHT = [-0.55, 0.75, -0.45];
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.playing) {
    if (state.aval.running) {
      state.aval.t += dt * TEND / AVAL_SECONDS;
      if (state.aval.t >= TEND) { state.aval.t = TEND; state.aval.running = false; state.aval.shown = true; }
    } else {
      const before = state.day;
      state.day = Math.min(days.length - 1, state.day + dt * DAYS_PER_SEC);
      if (before < KE && state.day >= KE && !state.aval.shown) {
        state.day = KE; state.aval = { t: 0, running: true, shown: true };
        if (now - lastUser > 4000) goView('release', 1.6);
      }
      if (state.day >= days.length - 1) setPlay(false);
    }
  }
  if (tween) { tween.t += dt / tween.dur; const f = tween.t >= 1 ? 1 : 0.5 - 0.5 * Math.cos(Math.PI * tween.t);
    const A = tween.from, B = tween.to; let dy = B.yaw - A.yaw; while (dy > Math.PI) dy -= 2 * Math.PI; while (dy < -Math.PI) dy += 2 * Math.PI;
    cam = { target: A.target.map((v, i) => v + (B.target[i] - v) * f), yaw: A.yaw + dy * f, pitch: A.pitch + (B.pitch - A.pitch) * f, dist: A.dist + (B.dist - A.dist) * f };
    if (tween.t >= 1) tween = null; }
  else if (!drag && now - lastUser > 6000 && !state.aval.running) cam.yaw += dt * 0.03;

  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.05, 0.06, 0.08, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  const eye = eyeOf(cam), tgt = [cam.target[0], cam.target[1] * VE, cam.target[2]];
  const MVP = mul(persp(0.75, w / h, 0.2, 2000), lookAt(eye, tgt, [0, 1, 0]));
  const k = Math.min(days.length - 1, Math.max(0, state.day)), k0 = Math.floor(k), k1 = Math.min(k0 + 1, days.length - 1);
  const fl = (days[k0].fl + (days[k1].fl - days[k0].fl) * (k - k0)) / 1000;

  gl.useProgram(terrainProg); gl.bindVertexArray(tVao);
  gl.uniformMatrix4fv(LT.uMVP, false, MVP); gl.uniform1f(LT.uVE, VE); gl.uniform1f(LT.uFL, fl);
  gl.uniform3fv(LT.uLight, LIGHT); gl.uniform1f(LT.uPulse, 0.5 + 0.5 * Math.sin(now / 350));
  gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_INT, 0);

  gl.useProgram(flatProg); gl.uniformMatrix4fv(LF.uMVP, false, MVP); gl.uniform1f(LF.uVE, VE);
  gl.uniform1f(LF.uYOff, 0);
  tileVaos.forEach(t => { gl.bindVertexArray(t.v); gl.uniform4fv(LF.uColor, t.main ? [0.90, 0.40, 0.40, 1] : [0.75, 0.75, 0.72, 0.6]); gl.drawArrays(gl.LINES, 0, t.n); });

  // path ribbon grows with the front
  let front = 0;
  if (state.aval.running) front = Math.round(interp(P.t, SIDX, state.aval.t));
  else if (state.aval.shown && state.day >= KE) front = NP - 1;
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  if (front > 0) { gl.bindVertexArray(rVao); gl.uniform4fv(LF.uColor, [0.82, 0.23, 0.23, 0.78]); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 2 * (front + 1)); }

  if (state.aval.running || (state.aval.shown && state.day >= KE)) {
    updateParticles(state.aval.t, !state.aval.running && state.aval.shown);
    gl.useProgram(pointProg); gl.bindVertexArray(pVao); gl.uniformMatrix4fv(LP.uMVP, false, MVP); gl.uniform1f(LP.uVE, VE);
    gl.uniform1f(LP.uSize, 240); gl.uniform4fv(LP.uColor, [0.90, 0.95, 1.0, 0.75]); gl.depthMask(false);
    gl.drawArrays(gl.POINTS, 0, NPART); gl.depthMask(true);
  }
  if (state.flPlane) {
    gl.useProgram(flatProg); gl.bindVertexArray(plVao); gl.uniform1f(LF.uYOff, fl); gl.depthMask(false);
    gl.uniform4fv(LF.uColor, [0.36, 0.55, 0.98, 0.10]); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindVertexArray(plEdge); gl.uniform4fv(LF.uColor, [0.45, 0.62, 1.0, 0.9]); gl.drawArrays(gl.LINE_LOOP, 0, 4); gl.depthMask(true);
  }
  gl.disable(gl.BLEND); gl.bindVertexArray(null);

  const placed = [];
  LBL.forEach(l => { const p = [l.w[0], l.w[1] * VE, l.w[2], 1];
    const x = MVP[0] * p[0] + MVP[4] * p[1] + MVP[8] * p[2] + MVP[12], y = MVP[1] * p[0] + MVP[5] * p[1] + MVP[9] * p[2] + MVP[13], ww = MVP[3] * p[0] + MVP[7] * p[1] + MVP[11] * p[2] + MVP[15];
    if (ww <= 0) { l.el.style.display = 'none'; return; }
    const sx = ((x / ww) * 0.5 + 0.5) * w, sy = ((-y / ww) * 0.5 + 0.5) * h;
    if (placed.some(q => Math.abs(q[0] - sx) < 110 && Math.abs(q[1] - sy) < 20)) { l.el.style.display = 'none'; return; }
    placed.push([sx, sy]); l.el.style.display = 'block'; l.el.style.left = sx + 'px'; l.el.style.top = sy + 'px'; });
  hud(k); drawCharts(k);
  requestAnimationFrame(frame);
}
window.__story = state; window.__goView = goView; window.__setCam = c => { cam = c; tween = null; lastUser = performance.now(); };
requestAnimationFrame(frame);
})();
