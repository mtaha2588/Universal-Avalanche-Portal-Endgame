<!-- background: the owner's film (static/models/media/background.mp4, shared on Drive 11 Nov 2026). The ambient layer is the same film,
     drawn tiny into a canvas and scaled up (a soft glow of its own colours); the framed player shows it sharp on the overview. -->
<canvas class="mf-amb" id="mf-amb" width="64" height="36" aria-hidden="true"></canvas>
<div class="mf-veil" aria-hidden="true"></div>
<figure class="mf-film" id="mf-film">

    <button type="button" data-film="play" aria-label="Pause the film">❚❚</button><button type="button" data-film="full" aria-label="Full screen">⤢</button></figcaption>
</figure>
<div class="mf-app" id="mf-app" data-title="{{ title }}"></div>
<script type="module" src="/static/models/models.js?v={{ v }}"></script>
