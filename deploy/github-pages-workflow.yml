# Publishes ONLY the static interview demo (demo/) to GitHub Pages:
#   https://mtaha2588.github.io/Universal-Avalanche-Portal-Endgame/
# The portal itself (Flask, forecast engine, data) is not deployed by this workflow.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Demo on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["demo/**", ".github/workflows/demo-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the demo files
        run: |
          for f in demo/index.html demo/demo.js demo/demo.css demo/config.js demo/assets/demo.mp4 demo/assets/poster.jpg demo/data/facts.json demo/data/chapters.json; do
            test -s "$f" || { echo "missing: $f"; exit 1; }
          done
          touch demo/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
