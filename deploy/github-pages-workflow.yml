# Optional: publishes ONLY the static interview demo (demo/) to GitHub Pages from main.
# The demo is currently published from the "gh-pages" branch instead (scripts/publish_demo.py), because the
# GitHub token in use has no "workflow" scope. To use this workflow instead: copy it to
# .github/workflows/demo-pages.yml, push with a token that has the workflow scope, and set
# Settings -> Pages -> Source: "GitHub Actions".
name: Demo on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["demo/**", ".github/workflows/demo-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the demo files
        run: |
          for f in demo/index.html demo/demo.js demo/demo.css demo/config.js demo/assets/demo.mp4 demo/assets/poster.jpg demo/data/facts.json demo/data/chapters.json; do
            test -s "$f" || { echo "missing: $f"; exit 1; }
          done
          touch demo/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
